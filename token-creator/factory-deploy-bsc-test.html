const TARGET_CHAIN = 97;
const TARGET_CHAIN_HEX = "0x61";

const BSC_TESTNET_RPCS = [
  "https://bsc-testnet-dataseed.bnbchain.org",
  "https://bsc-testnet.bnbchain.org",
  "https://bsc-prebsc-dataseed.bnbchain.org"
];

async function rpcRead(method, params=[]){
  let lastError = null;

  for(const url of BSC_TESTNET_RPCS){
    try{
      const response = await fetch(url,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          jsonrpc:"2.0",
          id:Date.now(),
          method,
          params
        })
      });

      if(!response.ok){
        throw new Error("HTTP "+response.status);
      }

      const data = await response.json();

      if(data.error){
        throw new Error(
          data.error.message || "RPC error"
        );
      }

      return data.result;

    }catch(e){
      console.warn("RPC failed:",url,e);
      lastError=e;
    }
  }

  throw new Error(
    "Semua RPC BSC Testnet gagal: "+
    (lastError?.message || lastError || "unknown")
  );
}

const accountEl = document.getElementById("account");
const statusEl = document.getElementById("status");
const connectBtn = document.getElementById("connectBtn");
const checkBtn = document.getElementById("checkBtn");
const deployBtn = document.getElementById("deployBtn");

function status(msg, cls=""){
  statusEl.className = cls;
  statusEl.innerHTML = msg;
}

function currentReownProvider(){
  try{
    return (
      window.ANGRY_REOWN?.getWalletProvider?.() ||
      window.ANGRY_REOWN?.getProviders?.()?.eip155 ||
      null
    );
  }catch(e){
    return null;
  }
}

function provider(){
  // Inside MetaMask's own browser, use MetaMask directly.
  // This avoids WalletConnect handoff delays during Factory testing.
  if(window.ethereum?.isMetaMask){
    return window.ethereum;
  }

  return currentReownProvider() || PROVIDER || window.ethereum || null;
}

async function waitForBscTestnetProvider(){
  let lastChain = null;

  for(let i=0;i<40;i++){
    const p = provider();

    if(p){
      try{
        const raw = await p.request({method:"eth_chainId"});
        const current =
          typeof raw === "string"
            ? parseInt(raw,16)
            : Number(raw);

        lastChain = current;

        if(current === TARGET_CHAIN){
          PROVIDER = p;
          return p;
        }
      }catch(e){}
    }

    await new Promise(r=>setTimeout(r,150));
  }

  throw new Error(
    "Wallet provider masih membaca Chain ID "+
    (lastChain ?? "unknown")+
    ", bukan BSC Testnet Chain ID 97."
  );
}

window.angrySetWalletProvider = function(p){
  PROVIDER = p || window.ethereum || null;
};

window.angryApplyConnectedAccount = function(address){
  ACCOUNT = address || null;
  accountEl.textContent = ACCOUNT || "Not connected";
  checkBtn.disabled = !ACCOUNT;
  deployBtn.disabled = true;
  PREFLIGHT_OK = false;
};

async function syncAccount(){
  const p = provider();
  if(!p) throw new Error("Wallet provider not available.");

  const accounts = await p.request({method:"eth_accounts"});
  if(accounts && accounts[0]){
    window.angryApplyConnectedAccount(accounts[0]);
  }

  if(!ACCOUNT) throw new Error("Wallet account not connected.");
}

async function ensureBscTestnet(){
  const p = provider();
  if(!p) throw new Error("Wallet provider not available.");

  if(
    !window.ethereum?.isMetaMask &&
    typeof window.angrySwitchReownNetwork === "function"
  ){
    try{
      await window.angrySwitchReownNetwork(TARGET_CHAIN);

      const synced = await waitForBscTestnetProvider();
      PROVIDER = synced;
      return true;
    }catch(e){
      console.warn("Reown switch fallback:", e);
    }
  }

  let freshProvider = provider();

  let raw = await freshProvider.request({method:"eth_chainId"});
  let current = parseInt(raw,16);

  if(current !== TARGET_CHAIN){
    try{
      await freshProvider.request({
        method:"wallet_switchEthereumChain",
        params:[{chainId:TARGET_CHAIN_HEX}]
      });
    }catch(e){
      if(e.code===4902 || String(e.message||"").toLowerCase().includes("unrecognized")){
        await freshProvider.request({
          method:"wallet_addEthereumChain",
          params:[{
            chainId:TARGET_CHAIN_HEX,
            chainName:"BSC Testnet",
            nativeCurrency:{name:"tBNB",symbol:"tBNB",decimals:18},
            rpcUrls:["https://bsc-testnet-dataseed.bnbchain.org"],
            blockExplorerUrls:["https://testnet.bscscan.com"]
          }]
        });
      }else{
        throw e;
      }
    }
  }

  freshProvider = await waitForBscTestnetProvider();
  PROVIDER = freshProvider;

  raw = await freshProvider.request({method:"eth_chainId"});
  current = parseInt(raw,16);

  if(current !== TARGET_CHAIN){
    throw new Error("Wallet is not on BSC Testnet Chain ID 97.");
  }

  return true;
}

function fromWei(hex){
  return Number(BigInt(hex)) / 1e18;
}

async function runPreflight(){
  PREFLIGHT_OK=false;
  PREFLIGHT_GAS=null;
  PREFLIGHT_GAS_PRICE=null;
  deployBtn.disabled=true;

  await syncAccount();
  await ensureBscTestnet();

  const p=provider();

  status("Checking BSC Testnet gas and wallet balance…","warn");

  const tx={
    from:ACCOUNT,
    data:FACTORY_BYTECODE
  };

  const gasHex = await rpcRead(
    "eth_estimateGas",
    [tx]
  );

  const gasPriceHex = await rpcRead(
    "eth_gasPrice",
    []
  );

  const balanceHex = await rpcRead(
    "eth_getBalance",
    [ACCOUNT,"latest"]
  );

  const gas=BigInt(gasHex);
  const gasPrice=BigInt(gasPriceHex);
  const bufferedGas=(gas*120n)/100n;
  const estimatedCost=bufferedGas*gasPrice;
  const balance=BigInt(balanceHex);

  PREFLIGHT_GAS =
    "0x"+bufferedGas.toString(16);

  PREFLIGHT_GAS_PRICE =
    "0x"+gasPrice.toString(16);

  status(
    "✅ Factory deployment preflight passed.<br>"+
    "Estimated gas: <b>"+gas.toString()+"</b><br>"+
    "Wallet balance: <b>"+fromWei(balanceHex).toFixed(6)+" tBNB</b><br>"+
    "Approx. buffered gas cost: <b>"+(Number(estimatedCost)/1e18).toFixed(6)+" tBNB</b><br><br>"+
    (balance >= estimatedCost
      ? "Wallet has enough tBNB to attempt deployment."
      : "Not enough tBNB. No transaction has been sent."),
    balance >= estimatedCost ? "good" : "bad"
  );

  if(balance >= estimatedCost){
    PREFLIGHT_OK=true;
    deployBtn.disabled=false;
  }
}

async function waitReceipt(hash){
  const p=provider();

  for(let i=0;i<120;i++){
    const receipt=await rpcRead(
      "eth_getTransactionReceipt",
      [hash]
    );

    if(receipt) return receipt;

    await new Promise(r=>setTimeout(r,2500));
  }

  throw new Error("Receipt timeout. Check BscScan using transaction hash: "+hash);
}

connectBtn.onclick=async()=>{
  try{
    status("Opening wallet…","warn");

    if(window.ethereum?.isMetaMask){
      PROVIDER = window.ethereum;

      const accounts = await PROVIDER.request({
        method:"eth_requestAccounts"
      });

      if(!accounts || !accounts[0]){
        throw new Error("MetaMask account tidak tersedia.");
      }

      window.angryApplyConnectedAccount(accounts[0]);
      await ensureBscTestnet();

      status(
        "✅ MetaMask terhubung langsung di BSC Testnet. Sekarang jalankan pemeriksaan deployment.",
        "good"
      );

      return;
    }

    if(typeof window.angryOpenReown !== "function"){
      throw new Error("Reown connector is still loading.");
    }

    await window.angryOpenReown(TARGET_CHAIN);
    await new Promise(r=>setTimeout(r,500));
    await syncAccount();
    await ensureBscTestnet();

    status("✅ Wallet connected on BSC Testnet. Now run the deployment check.","good");
  }catch(e){
    status("Connection failed: "+(e?.message||e),"bad");
  }
};

checkBtn.onclick=async()=>{
  try{
    await runPreflight();
  }catch(e){
    status("Preflight failed: "+(e?.message||e),"bad");
  }
};

      "Jangan tutup halaman ini.",
      "warn"
    );

    // Network/account were already verified immediately before
    // the confirmation dialog. Do not perform a second provider
    // synchronization here because some WalletConnect providers
    // can stall on another eth_chainId request.
    const sendProvider = PROVIDER || provider();

    if(!sendProvider){
      throw new Error("Wallet provider tidak tersedia.");
    }

    if(!PREFLIGHT_GAS || !PREFLIGHT_GAS_PRICE){
      throw new Error(
        "Data gas preflight tidak tersedia. Jalankan pemeriksaan deployment lagi."
      );
    }

    // WalletConnect Universal Provider can route a request
    // explicitly to a CAIP-2 chain. Also set it as default
    // when that method is available.
    if(typeof sendProvider.setDefaultChain === "function"){
      try{
        await sendProvider.setDefaultChain(
          "eip155:97"
        );
      }catch(e){
        console.warn("setDefaultChain warning:",e);
      }
    }

    const txParams = {
      from: ACCOUNT,
      data: FACTORY_BYTECODE,
      gas: PREFLIGHT_GAS,
      gasPrice: PREFLIGHT_GAS_PRICE
    };

    status(
      "⏳ Permintaan transaksi BSC Testnet sedang menunggu persetujuan wallet.<br><br>"+
      "Jika aplikasi wallet tidak terbuka otomatis, buka wallet yang terhubung secara manual dan periksa permintaan transaksi yang menunggu.",
      "warn"
    );

    const hash = await sendProvider.request(
      {
        method:"eth_sendTransaction",
        params:[txParams]
      },
      "eip155:97"
    );

    if(!hash){
      throw new Error("Wallet tidak mengembalikan transaction hash.");
    }

    status(
      "✅ Transaction sent:<br><b>"+hash+"</b><br><br>Waiting for confirmation…",
      "warn"
    );

    const receipt=await waitReceipt(hash);

    if(!receipt.contractAddress){
      throw new Error("Transaction confirmed but no Factory address returned.");
    }

    status(
      "✅ ANGRY Factory deployed on BSC Testnet.<br><br>"+
      "Factory address:<br><b>"+receipt.contractAddress+"</b><br><br>"+
      '<a style="color:#ff8a50" target="_blank" href="https://testnet.bscscan.com/address/'+receipt.contractAddress+'">Open on BscScan</a>',
      "good"
    );

  }catch(e){
    deployBtn.disabled=false;
    status("Factory deployment failed: "+(e?.message||e),"bad");
  }
};
</script>
